name: 4am BOT

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run bot
        run: node bot.js

　　　　- name: Upload debug screenshot
        uses: actions/upload-artifact@v4
        if: always() # エラーでも成功でも必ずアップロードする
        with:
          name: screenshots
          path: '*.png'
