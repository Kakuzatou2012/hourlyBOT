name: 4am Bot

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-morning-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Run 4am Bot
        run: node morning.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4am-screenshots
          path: '*.png'
