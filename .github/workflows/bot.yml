name: Hourly & 4AM Unified Bot

on:
  schedule:
    # 毎時0分に自動実行 (UTC 15:00 = JST 0:00, UTC 19:00 = JST 4:00)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モードを選択してください'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'         # 定時自動投稿 (4時は画像添付、その他は通常アナウンス)
          - 'dry_run'      # テストモード (投稿直前スクショ保存)
          - 'force_post'   # 通常アナウンスを即時投稿

concurrency:
  group: bot-execution
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run National Bot
        env:
          SNS_USER: ${{ secrets.SNS_USER }}
          SNS_PASS: ${{ secrets.SNS_PASS }}
          MODE: ${{ inputs.mode || 'auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bot.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: '*.png'
          retention-days: 3
