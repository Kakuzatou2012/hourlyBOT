name: Hourly & 4AM Unified Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: '時間外でも実際に投稿・送金する（通常テスト時は未チェックでOK）'
        type: boolean
        default: false

concurrency:
  group: bot-execution
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run National Bot
        env:
          SNS_USER: ${{ secrets.SNS_USER }}
          SNS_PASS: ${{ secrets.SNS_PASS }}
          FORCE_POST: ${{ inputs.force_post || 'false' }}
        run: node bot.js

      # テスト直前スクショを含め、全スクリーンショットを保存
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: '*.png'
          retention-days: 3
