name: Hourly Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Run Hourly Bot
        env:
          SNS_USER: ${{ secrets.SNS_USER }}
          SNS_PASS: ${{ secrets.SNS_PASS }}
        run: node bot.js

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-screenshots
          path: '*.png'
