name: Hourly & 4AM Unified Bot

on:
  schedule:
    # 毎時0分に自動実行 (UTC 15:00 = JST 0:00, UTC 9:00 = JST 18:00)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モードを選択してください'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'         # 定時自動判定 (毎時アナウンス / 18時はイベント)
          - 'event_now'    # ★【手動イベント】今すぐ不定期タイピング選手権を開催 (5分審査 ＆ コイン送金)
          - 'dry_run'      # 安全テストモード (送金直前スクショ ＆ 直近ユーザー確認)
          - 'force_post'   # 通常アナウンスを即時投稿
      custom_keyword:
        description: 'お題キーワード (空欄なら12個の単語からランダム自動選出)'
        required: false
        default: ''
        type: string
      custom_coins:
        description: '賞金コイン数 (デフォルト: 25)'
        required: false
        default: '25'
        type: string

concurrency:
  group: bot-execution
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run National Bot
        env:
          SNS_USER: ${{ secrets.SNS_USER }}
          SNS_PASS: ${{ secrets.SNS_PASS }}
          MODE: ${{ inputs.mode || 'auto' }}
          CUSTOM_KEYWORD: ${{ inputs.custom_keyword || '' }}
          CUSTOM_COINS: ${{ inputs.custom_coins || '25' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bot.js

      - name: Commit and push winners.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -f winners.json ]; then
            git add winners.json
            git commit -m "auto: update winners.json event records [skip ci]" || echo "No changes to commit"
            git push origin HEAD:main || echo "Push failed"
          fi

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: '*.png'
          retention-days: 3
