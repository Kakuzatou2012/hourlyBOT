name: Hourly & 4AM Unified Bot

on:
  schedule:
    # 毎時0分に自動実行 (UTC 15:00 = JST 0:00, UTC 9:00 = JST 18:00)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モードを選択してください'
        required: true
        default: 'event_now'
        type: choice
        options:
          - 'event_now'    # ★【不定期型イベント】今すぐタイピング選手権を開催 (手動投稿 ＆ 5分審査 ＆ 25コイン送金)
          - 'auto'         # 定時自動判定 (毎時アナウンス / 18時はイベント)
          - 'dry_run'      # 安全テストモード (送金直前スクショ ＆ 直近ユーザー確認)
          - 'force_post'   # 通常アナウンスを即時投稿
      custom_keyword:
        description: 'お題キーワード (空欄なら12個の単語からランダム自動選出)'
        required: false
        default: ''
        type: string
      custom_coins:
        description: '賞金コイン数 (デフォルト: 25)'
        required: false
        default: '25'
        type: string

concurrency:
  group: bot-execution
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 5分間の審査時間があるため10分に設定
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run National Bot
        env:
          SNS_USER: ${{ secrets.SNS_USER }}
          SNS_PASS: ${{ secrets.SNS_PASS }}
          MODE: ${{ inputs.mode || 'auto' }}
          CUSTOM_KEYWORD: ${{ inputs.custom_keyword || '' }}
          CUSTOM_COINS: ${{ inputs.custom_coins || '25' }}
        run: node bot.js

      # スクリーンショットをアーティファクトに保存
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: '*.png'
          retention-days: 3
